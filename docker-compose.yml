services:
  atomicmail-panel:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      MAX_BATCH_SIZE: 100
      POST_SUCCESS_DELAY_MS: 5000
      MAX_RETRIES: 3
      RATE_LIMIT_COOLDOWN_MS: 300000
      SHUTDOWN_GRACE_MS: 20000
      ATOMICMAIL_WATCH_MODE: on-demand
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      SECRETS_DIR: /app/secrets
      DATA_ENCRYPTION_KEY_FILE: /app/secrets/data.key
      BACKUP_DIR: /app/backups
      AUTO_BACKUP_ENABLED: ${AUTO_BACKUP_ENABLED:-true}
      AUTO_BACKUP_INTERVAL_MINUTES: ${AUTO_BACKUP_INTERVAL_MINUTES:-360}
      BACKUP_MIN_GAP_MINUTES: ${BACKUP_MIN_GAP_MINUTES:-5}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
      - ./backups:/app/backups
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
